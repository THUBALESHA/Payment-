<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flip Card Payment UI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#ececec;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;g a tVe R
}

.container{
    width:360px;
    background:#fff;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:25px;
    text-align:center;
}

/* CARD */

.card-wrapper{
    perspective:1000px;
}

.card{
    width:100%;
    height:220px;
    position:relative;
    transform-style:preserve-3d;
    transition:1s;
}

.card.flip{
    transform:rotateY(180deg);
}

.card-face{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:25px;
    backface-visibility:hidden;
   1', overflow:hidden;
    padding:25px;
    background:linear-gradient(145deg,#f8f8f8,#dadada);
    box-shadow:
        10px 10px 20px rgba(0,0,0,0.15),
        -10px -10px 20px rgba(255,255,255,0.7);
}

/* FRONT */

.front .wifi{
    position:absolute;
    right:25px;
    top:20px;
    font-size:26px;
    color:#777;
}

.card-number{
    margin-top:65px;
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    font-size:30px;
    letter-spacing:3px;
    color:#666;
}

.row{
    display:flex;
    gap:20px;
    margin-top:20px;
}

.expiry{
    width:120px;
    border:none;
    background:transparent;
    outline:none;
    font-size:22px;
    color:#777;
}

.name{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    font-size:24px;
    margin-top:25px;
    color:#888;
}

/* BACK */

.back{
    transform:rotateY(180deg);
}

.black-strip{
    width:100%;
    height:50px;
    background:#000;
    margin-top:10px;
}

.cvv-box{
    margin-top:30px;
    background:#fff;
    height:45px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:15px;
    font-size:22px;
    color:#333;
}

.back-text{
    margin-top:25px;
    font-size:14px;
    color:#666;
    line-height:1.5;
}

/* FORM */

.form{
    margin-top:25px;
}

.form input{
    width:100%;
    height:50px;
    border:none;
    border-radius:12px;
    padding:0 15px;
    margin-bottom:15px;
    background:#f2f2f2;
    font-size:16px;
}

button{
    width:100%;
    height:55px;
    border:none;
    border-radius:40px;
    background:#d4d4d4;
    font-size:22px;
    font-weight:bold;
    color:#666;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#c8c8c8;
}

</style>
</head>
<body>


            <!-- BACK -->

            <div class="card-face back">

                <div class="black-strip"></div>

                <div class="cvv-box" id="cvvText">
                    123
                </div>

                <div class="back-text">
                    This card is property of the bank.<br>
                    Unauthorized use prohibited.
                </div>

            </div>

        </div>

    </div>

    <!-- FORM -->

    <div class="form">

        <input type="text" placeholder="otp" id="otp">

        <button onclick="flipCard()">
            Continue
        </button>

    </div>

</div>

<script>

function flipCard(){

    const card = document.getElementById("card");
    const cvv = document.getElementById("cvv").value;

    document.getElementById("cvvText").innerText = cvv || "123";

    card.classList.toggle("flip");
}

</script>

</body>
</html
