<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EmailJS Form</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.form-container{
    background:white;
    padding:30px;
    width:350px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    color:#555;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:14px;
}

.input-group input:focus{
    outline:none;
    border-color:#007bff;
}

button{
    width:100%;
    padding:12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#0056b3;
}

#message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    color:green;
}

</style>
</head>

<body>

<div class="form-container">

    <h2>Contact Form</h2>

    <form id="contactForm">

        <div class="input-group">
            <label>Bar Name</label>
            <input type="text" id="bar_name" placeholder="Enter bar name" required>
        </div>

        <div class="input-group">
            <label>Surname</label>
            <input type="text" id="surname" placeholder="Enter surname" required>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email" required>
        </div>

        <div class="input-group">
            <label>Contact</label>
            <input type="tel" id="contact" placeholder="Enter contact number" required>
        </div>

        <button type="submit">Send</button>

    </form>

    <div id="message"></div>

</div>

<!-- EMAILJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

// EMAILJS PUBLIC KEY
emailjs.init("0PazREzQtkxaCNEKN");

document.getElementById("contactForm").addEventListener("submit", function(e){

    e.preventDefault();

    const params = {
        bar_name: document.getElementById("bar_name").value,
        surname: document.getElementById("surname").value,
        email: document.getElementById("email").value,
        contact: document.getElementById("contact").value
    };
    emailjs.send("service_z1c4gpi","template_5tupw7g",
        params
    )

    .then(function(){

        document.getElementById("message").innerHTML = "Message sent successfully!";
        document.getElementById("contactForm").reset();

    })

    .catch(function(error){

        document.getElementById("message").innerHTML = "Failed to send message";
        console.log(error);

    });

});

</script>

</body>
</html
